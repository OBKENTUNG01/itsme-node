name: test

on:
  push:
    branches: [ main, "feat/**", "fix/**", "chore/**", "audit/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi uji
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Lint (kelas bug nyata)
        run: ruff check --select E9,F63,F7,F82,W6,B --output-format concise .
      - name: Uji
        run: python -m pytest tests -q
